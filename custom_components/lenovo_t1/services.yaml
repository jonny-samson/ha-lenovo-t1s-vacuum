clean_rooms:
  target:
    entity:
      integration: lenovo_t1
      domain: vacuum
  fields:
    rooms:
      required: true
      example: '["Kitchen", "Living Room"]'
      selector:
        object:

drive:
  target:
    entity:
      integration: lenovo_t1
      domain: vacuum
  fields:
    direction:
      required: true
      example: forward
      selector:
        select:
          options: [forward, back, left, right]
          translation_key: direction
    duration:
      required: false
      example: 1.5
      selector:
        number:
          min: 0.25
          max: 10
          step: 0.25
          unit_of_measurement: s
